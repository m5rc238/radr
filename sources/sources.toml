# Information Radar — source registry (Stage 1)
#
# Every URL in this file was verified live on 2026-10-08 (HTTP 200,
# feed parses as RSS 2.0). See SOURCES.md for rationale and provenance.
#
# Fields per source:
#   id            stable identifier (used in the database)
#   name          human-readable name
#   url           canonical source URL
#   feed_url      RSS/Atom endpoint used for ingestion
#   source_type   academic | official-research | technical | news | other
#   topics        list of configured topic names
#   enabled       whether to ingest
#   content_from  "feed"  -> document content comes from the feed entry
#                 "page"  -> document content is fetched from the entry URL
#   max_entries   cap on newest entries ingested per run (keeps corpus small)
#   description   why this source is in the registry

[ingest]
user_agent = "InformationRadar/0.1 (personal research corpus; polite fetcher)"
delay_seconds = 1.0
timeout_seconds = 20
robots_check = true

[[sources]]
id = "arxiv-cs-ai"
name = "arXiv cs.AI"
url = "https://arxiv.org/list/cs.AI/recent"
feed_url = "https://rss.arxiv.org/rss/cs.AI"
source_type = "academic"
topics = ["AI systems"]
enabled = true
content_from = "feed"
max_entries = 30
description = "arXiv Artificial Intelligence listings; full abstracts in feed, stable /abs/ URLs, clear submission dates."

